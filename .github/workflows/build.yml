# G1: the pinned build, and the promotion verdicts for what is already in C.
#
# The retail ELF is never in this repository (AGENTS.md rule 5).  CI fetches it from wherever
# the maintainer keeps it and G1 then checks it against the digest pinned in
# config/usam2/checksums.txt, so a truncated or wrong-version copy fails loudly instead of
# being compared with the build.  The disc image, which G3 needs, is 1.24 GB: the runner has
# no mount, so `--iso` prints "G3 skipped" and exits 0 rather than pretending to have run it.
name: build

on: [push, pull_request, workflow_dispatch]

jobs:
  skeleton:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: sudo apt-get update && sudo apt-get install -y binutils-mips-linux-gnu ninja-build

      # Homebrew's python3 is externally managed (PEP 668), so the Python tools go into a
      # venv that is then first on PATH: `python3 -m splat` has to import for splat to run.
      - name: Python tools
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install 'splat64[mips]' pytest
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: objdiff-cli
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/objdiff-cli" \
            https://github.com/encounter/objdiff/releases/download/v3.8.2/objdiff-cli-linux-x86_64
          chmod +x "$HOME/.local/bin/objdiff-cli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Proprietary, fetched and hash-verified into the gitignored toolchain/.  2.4-001213 is
      # the required build; 3.0-011126 is the one the promoted unit was measured against.
      - name: Toolchain
        run: python3 tools/toolchain/fetch.py 2.4-001213 3.0-011126


      - name: Retail ELF (supplied out of band)
        env:
          RETAIL_ELF_URL: ${{ secrets.RETAIL_ELF_URL }}
        run: |
          if [ -z "$RETAIL_ELF_URL" ]; then
            echo "::error title=no retail ELF::RETAIL_ELF_URL is unset; the build needs orig/SLUS_211.74 (AGENTS.md rule 5)"
            exit 1
          fi
          mkdir -p orig
          curl -fsSL -o orig/SLUS_211.74 "$RETAIL_ELF_URL"
      - name: Overlay pack (supplied out of band)
        env:
          OVERLAY_PACK_URL: ${{ secrets.OVERLAY_PACK_URL }}
        run: |
          if [ -z "$OVERLAY_PACK_URL" ]; then
            echo "::error title=no overlay pack::OVERLAY_PACK_URL is unset (AGENTS.md rule 5); configure slices each overlay module out of the disc image or takes it from build/overlays/<module>.bin, and CI has no image"
            exit 1
          fi
          mkdir -p build/overlays
          curl -fsSL -o "$RUNNER_TEMP/overlay-pack.tar.gz" "$OVERLAY_PACK_URL"
          tar -xzf "$RUNNER_TEMP/overlay-pack.tar.gz" -C build/overlays

      - name: Build (configure, ninja, G1)
        run: ./ddr build

      - name: Verify (promotion rule; G3 when the retail image is available)
        run: ./ddr verify --tu sys_scf --iso

      # ~9 minutes, and the slowest step by design: the suite runs the real tools -- splat,
      # mips-linux-gnu-as, ld, objcopy and mwccps2 under wibo -- against the retail files.
      - name: Test suite
        run: python3 -m pytest -q
