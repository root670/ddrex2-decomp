# The progress report decomp.dev reads.
#
# decomp.dev (https://decomp.wiki/en/tools/decomp-dev) takes the report from a GitHub Actions
# artifact named `<version>_report` on the *default branch* -- it downloads the artifact and
# parses objdiff's Report schema; there is no upload key and no endpoint to call.  The
# project is registered once, by a maintainer, at https://decomp.dev/manage/new.
#
# The numbers are objdiff's byte-level view of the objects, measured the way the gates
# measure it.  A promoted unit is one objdiff unit whose *target* is an object built from the
# unit's own retail bytes -- `build/diff/<segment|module>/<unit>.unit.o`, every function of
# the unit at its retail offset under its retail name (tools/diff/basis.py) -- and whose base
# is the `cc` object; so a function the compiler reproduced counts as matched instead of
# scoring ~99.2% over a split's symbolic `jal`, which names an unresolved symbol (address
# zero) while our object carries the retail address.  The retail bytes are the file-backed
# image's for a main-image unit and the module *blob*'s for an overlay unit (the verified
# pack, else the disc image), named after its module because seven of this target's blobs
# load at one address.  A promoted unit whose bytes neither the pack nor the image can supply
# is a configuration error -- never a unit with no target, which the report would read as 0%.
# A split whose unit has no C yet keeps its own unit with a `null` base, which is what makes
# its bytes count as un-matched.
#
# `matched_data_percent` is *removed* from the uploaded report.  No unit has a data target --
# data stays pinned retail bytes by design (AGENTS.md rule 9) and G1, not this report, is
# what proves those bytes -- and objdiff prints 100% for a 0/0 ratio.  `tools/diff/report.py`
# drops a data measure whose denominator is empty, so the artifact decomp.dev reads makes no
# data claim rather than a fabricated 100% or a 0% on bytes that were never a work item.
#
# G1 and `./ddr verify --tu` are the arbiters; the report measures the C that has been written,
# which is the point of feeding decomp.dev.
name: progress

on:
  push:
    branches: [master]      # the default branch: decomp.dev only picks reports up from it
  workflow_dispatch:         # ... and it can be run by hand while the work is on a branch

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: sudo apt-get update && sudo apt-get install -y binutils-mips-linux-gnu ninja-build

      - name: Python tools
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install 'splat64[mips]'
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: objdiff-cli
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/objdiff-cli" \
            https://github.com/encounter/objdiff/releases/download/v3.8.2/objdiff-cli-linux-x86_64
          chmod +x "$HOME/.local/bin/objdiff-cli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Toolchain
        run: python3 tools/toolchain/fetch.py 2.4-001213 3.0-011126


      - name: Retail ELF (supplied out of band)
        env:
          RETAIL_ELF_URL: ${{ secrets.RETAIL_ELF_URL }}
        run: |
          if [ -z "$RETAIL_ELF_URL" ]; then
            echo "::error title=no retail ELF::RETAIL_ELF_URL is unset (AGENTS.md rule 5)"
            exit 1
          fi
          mkdir -p orig
          curl -fsSL -o orig/SLUS_211.74 "$RETAIL_ELF_URL"
      - name: Overlay pack (supplied out of band)
        env:
          OVERLAY_PACK_URL: ${{ secrets.OVERLAY_PACK_URL }}
        run: |
          if [ -z "$OVERLAY_PACK_URL" ]; then
            echo "::error title=no overlay pack::OVERLAY_PACK_URL is unset (AGENTS.md rule 5); configure slices each overlay module out of the disc image or takes it from build/overlays/<module>.bin, and CI has no image"
            exit 1
          fi
          mkdir -p build/overlays
          curl -fsSL -o "$RUNNER_TEMP/overlay-pack.tar.gz" "$OVERLAY_PACK_URL"
          tar -xzf "$RUNNER_TEMP/overlay-pack.tar.gz" -C build/overlays

      # The report needs both sides of every unit: the split objects (target) and the C
      # objects (base).
      - name: Build (objects and image; G1)
        run: ./ddr build

      - name: Report
        run: |
          objdiff-cli report generate -o build/report.json
          # Remove the 0/0 data measures objdiff prints as 100% (see the header).
          python3 tools/diff/report.py build/report.json

      # The artifact name matters: decomp.dev looks for `SLUS_211.74_report`.
      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: SLUS_211.74_report
          path: build/report.json
          if-no-files-found: error
