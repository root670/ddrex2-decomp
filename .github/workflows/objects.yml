# The objdiff object graph: every split assembled, nothing linked, no image.
#
# This is the job that produces objdiff's sides.  `configure.py --objects` writes a graph
# whose default target is `objects` (no `ld`, no `cat`, no gate), and `objdiff.json` -- which
# configure.py writes from the same manifests -- lists one unit per code object the link
# would place, with a `null` base for every function that has no source yet.
#
# The retail ELF is required (splat splits it) and is never in this repository: it arrives
# from a secret and G1's pin check is what makes that source trustworthy (AGENTS.md rule 5).
name: objects

on: [push, pull_request, workflow_dispatch]

jobs:
  objdiff:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: brew install mips-linux-gnu-binutils ninja

      - name: Python tools
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install 'splat64[mips]'
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: objdiff-cli
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/objdiff-cli" \
            https://github.com/encounter/objdiff/releases/download/v3.8.2/objdiff-cli-macos-arm64
          chmod +x "$HOME/.local/bin/objdiff-cli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Toolchain
        run: python3 tools/toolchain/fetch.py 2.4-001213 3.0-011126

      # The compiler runs through wibo, a Mach-O x86_64 binary (PROVENANCE.txt records the
      # version and digest): on an arm64 runner that needs Rosetta 2, which the image does
      # not always ship.
      - name: Rosetta 2
        run: |
          if [ -e /Library/Apple/usr/libexec/oah/libRosettaRuntime ]; then
            echo "Rosetta 2 is present"
          else
            sudo softwareupdate --install-rosetta --agree-to-license
          fi

      - name: Retail ELF (supplied out of band)
        env:
          RETAIL_ELF_URL: ${{ secrets.RETAIL_ELF_URL }}
        run: |
          if [ -z "$RETAIL_ELF_URL" ]; then
            echo "::error title=no retail ELF::RETAIL_ELF_URL is unset; splat needs orig/SLUS_211.74"
            exit 1
          fi
          mkdir -p orig
          curl -fsSL -o orig/SLUS_211.74 "$RETAIL_ELF_URL"
      - name: Overlay pack (supplied out of band)
        env:
          OVERLAY_PACK_URL: ${{ secrets.OVERLAY_PACK_URL }}
        run: |
          if [ -z "$OVERLAY_PACK_URL" ]; then
            echo "::error title=no overlay pack::OVERLAY_PACK_URL is unset (AGENTS.md rule 5); configure slices each overlay module out of the disc image or takes it from build/overlays/<module>.bin, and CI has no image"
            exit 1
          fi
          mkdir -p build/overlays
          curl -fsSL -o "$RUNNER_TEMP/overlay-pack.tar.gz" "$OVERLAY_PACK_URL"
          tar -xzf "$RUNNER_TEMP/overlay-pack.tar.gz" -C build/overlays

      - name: Object graph
        run: python3 configure.py --objects && ninja objects

      # ~8 MB and a couple of minutes: objdiff.json (657 KB) plus the ~7.5 MB of objects under
      # build/asm/ that the host assembler writes for 4,092 splits.  (The ~29 MB `du` reports
      # for build/ is block usage around 4,092 small files, not the uploaded set.)  This job
      # never links and never runs a gate, so it is the cheap place to see objdiff's raw
      # material.
      - name: Upload the objdiff artefacts
        uses: actions/upload-artifact@v4
        with:
          name: SLUS_211.74_objects
          path: |
            objdiff.json
            build/asm/**
          if-no-files-found: error
